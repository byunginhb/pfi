<?xml version="1.0" encoding="UTF-8"?>
<svg width="200" height="200" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- 두더지 몸통 -->
  <circle cx="100" cy="120" r="60" fill="#FFD700"/>
  <!-- 두더지 얼굴 -->
  <circle cx="100" cy="100" r="40" fill="#DAA520"/>
  <!-- 왼쪽 눈 -->
  <circle cx="85" cy="90" r="5" fill="black"/>
  <!-- 오른쪽 눈 -->
  <circle cx="115" cy="90" r="5" fill="black"/>
  <!-- 코 -->
  <circle cx="100" cy="100" r="8" fill="black"/>
  <!-- 볼 -->
  <circle cx="80" cy="100" r="10" fill="#FFA500" fill-opacity="0.5"/>
  <circle cx="120" cy="100" r="10" fill="#FFA500" fill-opacity="0.5"/>
  <!-- 반짝이 효과 -->
  <circle cx="70" cy="70" r="5" fill="white"/>
  <circle cx="130" cy="70" r="5" fill="white"/>
  <circle cx="100" cy="60" r="5" fill="white"/>
</svg> 