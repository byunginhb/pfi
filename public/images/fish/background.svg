<?xml version="1.0" encoding="UTF-8"?>
<svg width="1000" height="1000" viewBox="0 0 1000 1000" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- 배경 그라데이션 -->
  <defs>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E3F2FD"/>
      <stop offset="100%" stop-color="#1976D2"/>
    </linearGradient>
    
    <!-- 물방울 패턴 -->
    <pattern id="bubblePattern" x="0" y="0" width="100" height="100" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="2" fill="white" opacity="0.3"/>
      <circle cx="80" cy="40" r="3" fill="white" opacity="0.2"/>
      <circle cx="40" cy="70" r="1.5" fill="white" opacity="0.4"/>
    </pattern>
  </defs>
  
  <!-- 배경 -->
  <rect width="1000" height="1000" fill="url(#water)"/>
  
  <!-- 물방울 패턴 오버레이 -->
  <rect width="1000" height="1000" fill="url(#bubblePattern)"/>
  
  <!-- 빛 효과 -->
  <path d="M0 0 L1000 0 L1000 200 Q 500 300, 0 200 Z" fill="white" opacity="0.1"/>
</svg> 